    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="site-header">
        <div class="film-strip" aria-hidden="true">
            <div class="strip-holes"></div>
            <div class="strip-holes"></div>
        </div>
        <div class="header-content">
            <span class="header-eyebrow">Sua coleção</span>
            <h1>Catálogo <em>de Filmes</em></h1>
            <div class="search-container">
                <input
                    type="text"
                    id="search"
                    placeholder="Buscar por título..."
                    autocomplete="off"
                >
                <button id="btnSearch">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    Buscar
                </button>
            </div>
        </div>
        <div class="film-strip bottom" aria-hidden="true">
            <div class="strip-holes"></div>
            <div class="strip-holes"></div>
        </div>
    </header>

    <main>
        <p id="message"></p>
        <div id="movie-list"></div>
    </main>

    <script src="script.js"></script>

</body>
</html>
